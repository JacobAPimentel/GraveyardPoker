@let userVote = this.user().vote;

<div class="card" [class.noVote]="noVote()" [class.hideVote]="hideVote()">
    <p>
        @if(noVote())
        {
            ?
        }
        @else if(!hideVote())
        {
            {{room.choices[userVote!]}}
        }
    </p>
</div>
<p class="name">
    {{user().name}}
    @if(user().id === room.userId())
    {
        <span class="its-you">(You)</span>
    }
</p>
