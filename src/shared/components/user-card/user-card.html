@let userVote = this.user().vote;
@let noVote = userVote === null || userVote === undefined;

<div class="card" [class.noVote]="noVote">
    <p>
        @if(noVote)
        {
            ?
        }
        @else
        {
            {{room.choices[userVote]}}
        }
    </p>
</div>
<p class="name">
    {{user().name}}
    @if(user().id === room.userId())
    {
        <p class="its-you">(You)</p>
    }
</p>
