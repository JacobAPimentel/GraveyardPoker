<div class="card" [class.noVote]="noVote()" [class.hideVote]="hideVote()">
    <p>
        @if(noVote())
        {
            ?
        }
        @else if(!hideVote())
        {
            {{room.choices[this.user().vote!]}}
        }
    </p>
</div>
<p class="name">
    {{user().name}}
    @if(this.label())
    {
        <span class="user-label">{{this.label()}}</span>
    }
</p>
