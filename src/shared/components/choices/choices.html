@if(this.room.revealed())
{
    <h2 class="waiting-msg">Waiting for host to reset round.</h2>
}
<div class="cards">
    @for(choice of room.choices; let i = $index ; track i)
    {
        <button class="card" 
                [class.selected]="isSelected(i)"
                [class.disabled]="this.room.revealed()"
                (click)="madeChoice(i)">
                {{choice}}
        </button>
    }
</div>
