<div class="users">
    @for (user of room.userSignalList(); track user().id)
    {
        <app-user-card [user]="user()"/>
    }
</div>
<div class="results-container">
    <app-results />
    @if(this.room.isHost())
    {
        <button class="green-button"
                [class.reset-round]="this.room.revealed()"
                (click)="onMainButtonClick()">
            @if(this.room.revealed())
            {
                RESET ROUND
            }
            @else
            {
                REVEAL VOTES
            }
        </button>
    }
</div>
<app-choices />
