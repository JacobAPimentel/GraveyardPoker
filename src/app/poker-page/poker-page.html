<div class="users">
    @for (user of room.users | keyvalue; track $index)
    {
        <app-user-card [name]="user.value().name" [vote]="user.value().vote"/>
    }
</div>
<div class="results-container">
    <app-results />
    <button class="green-button">REVEAL VOTES</button>
</div>
<app-choices />
